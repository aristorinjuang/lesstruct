info:
  name: Get Catalog Product
  type: http
  seq: 10

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/public/catalog/products/{{PRODUCT_SLUG}}"
  params:
    - name: slug
      value: "{{PRODUCT_SLUG}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
