info:
  name: MCP Initialize
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE_URL}}/mcp"
  headers:
    - name: Accept
      value: application/json, text/event-stream
      disabled: false
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "initialize",
        "params": {
          "protocolVersion": "2025-06-18",
          "capabilities": {},
          "clientInfo": {
            "name": "bruno",
            "version": "1.0"
          }
        }
      }
  auth:
    type: bearer
    token: "{{API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
