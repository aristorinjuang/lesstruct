info:
  name: List Payments
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/payments"
  params:
    - name: status
      value: "{{PAYMENT_STATUS}}"
      type: query
      disabled: true
    - name: cursor
      value: "{{PAYMENT_CURSOR}}"
      type: query
      disabled: true
    - name: orderId
      value: "{{PAYMENT_ORDER_ID}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
