info:
  name: Update Content System Fields
  type: http
  seq: 14

http:
  method: PUT
  url: "{{BASE_URL}}/api/admin/content/{{CONTENT_ID}}/system-fields"
  body:
    type: json
    data: |-
      {
        "systemFields": {
          "editorial_status": "draft",
          "internal_notes": "Needs review"
        }
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
