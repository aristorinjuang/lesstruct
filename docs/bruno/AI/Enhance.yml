info:
  name: Enhance
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/text/enhance"
  body:
    type: json
    data: |-
      {
        "content": "Write a short intro about web development.",
        "format": "html"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
