info:
  name: Update Custom Fields
  type: http
  seq: 8

http:
  method: PUT
  url: "{{BASE_URL}}/api/profile/custom-fields"
  body:
    type: json
    data: |-
      {
        "customFields": {
          "bio": "Updated bio text"
        }
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
