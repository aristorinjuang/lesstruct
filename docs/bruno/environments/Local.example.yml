# Bruno environment template.
# Copy this file to Local.yml and replace the placeholders with your own values.
# Local.yml is gitignored — do not commit it.
name: Local
variables:
  - name: BASE_URL
    value: http://localhost:8080
  - secret: true
    name: PASSWORD
  - name: EMAIL
    value: admin@lesstruct.local
  - name: DATABASE_TYPE
    value: sqlite
  - name: USERNAME
    value: johndoe
  - secret: true
    name: USER_PASSWORD
  - name: USER_EMAIL
    value: alice@lesstruct.local
  - secret: true
    name: VERIFICATION_TOKEN
  # Login MFA: Login captures the challenge; MFA_CODE is the 6-digit code from
  # the email (or the server log under DEV_MODE with SMTP unconfigured).
  # Verify MFA sets the lesstruct_jwt HttpOnly session cookie, which Bruno's
  # cookie jar stores and sends on every browser-realm request below — no
  # token variable is needed.
  - secret: true
    name: MFA_CHALLENGE_TOKEN
  - name: MFA_CODE
    value: "123456"
  - name: USER_ID
    value: "5"
  - secret: true
    name: PROFILE_VERIFICATION_TOKEN
  - secret: true
    name: USER_PASSWORD_NEW
  - name: CONTENT_ID
    value: "1"
  - name: MEDIA_ID
    value: "1"
  - name: SLUG
    value: my-first-content
  # Agent (Bearer API key) realm — generated via "Create API Key"
  - secret: true
    name: API_KEY
  - name: API_KEY_ID
    value: "1"
  # Comment moderation / own-comments
  - name: COMMENT_ID
    value: "1"
  # Public author content listing
  - name: AUTHOR_USERNAME
    value: johndoe
  # WordPress async import job ID (returned by POST /api/admin/wordpress/import)
  - name: JOB_ID
    value: "1"
  # Password reset flow (token is emailed to the user)
  - secret: true
    name: RESET_TOKEN
  # Public search
  - name: SEARCH_QUERY
    value: hello
  # Public catalog product (eCommerce edition)
  - name: PRODUCT_SLUG
    value: tshirt
  # Public cart (eCommerce edition): token from Create Cart, item id from Add Cart Item
  - name: CART_TOKEN
    value: ""
  - name: CART_ITEM_ID
    value: "1"
  # Orders (eCommerce edition): CHECKOUT_EMAIL/NAME are the guest contact on
  # Checkout; ORDER_NUMBER + TRACK_EMAIL + TRACK_TOKEN drive guest tracking
  # (the token comes from the checkout response's trackingToken field or the
  # confirmation email's tracking link); ORDER_ID is the admin order surface
  - name: CHECKOUT_EMAIL
    value: customer@example.com
  - name: CHECKOUT_NAME
    value: Customer Name
  - name: CHECKOUT_PHONE
    value: ""
  - name: ORDER_NUMBER
    value: ORD-000001
  - name: TRACK_EMAIL
    value: customer@example.com
  - name: TRACK_TOKEN
    value: ""
  - name: ORDER_ID
    value: "1"
  # Admin orders list: optional lifecycle filter + keyset cursor from meta.pagination
  - name: ORDER_STATUS
    value: pending
  - name: ORDER_CURSOR
    value: ""
  # Payments (eCommerce edition): PAYMENT_ID drives the admin payment surface,
  # PAYMENT_STATUS/PAYMENT_CURSOR the admin list, PAYMENT_ORDER_ID one
  # order's history; the public proof submission and hosted session
  # reuse ORDER_NUMBER + TRACK_EMAIL + TRACK_TOKEN
  - name: PAYMENT_ID
    value: "1"
  - name: PAYMENT_STATUS
    value: pending
  - name: PAYMENT_CURSOR
    value: ""
  - name: PAYMENT_ORDER_ID
    value: "1"
