info:
  name: Create User
  type: http
  seq: 11

http:
  method: POST
  url: "{{BASE_URL}}/api/admin/users"
  body:
    type: json
    data: |-
      {
        "username": "newuser",
        "name": "New User",
        "email": "newuser@example.com",
        "role": "Commentator"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
