name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Own modules resolve directly from GitHub instead of proxy.golang.org:
# after a release commit lands, go.mod pins submodule versions whose tags
# may not have propagated through the proxy yet (the v1.1.4 incident —
# every package failed setup with "unknown revision"). The repo is public,
# so direct fetch needs no credentials, and the checksum database is
# skipped for this path only.
env:
  GOPRIVATE: github.com/aristorinjuang/lesstruct

permissions:
  contents: read

jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go test ./... -race -cover

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Check for modern Go syntax
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@v0.21.1 -test $(go list ./... | grep -v '/web/')
      - name: Check file layout style
        run: go run ./tools/stylecheck/cmd/stylecheck .

  go-vulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: golang/govulncheck-action@v1

  build-admin:
    name: Build Admin Panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci && npm run build-only
        working-directory: web/admin/
