info:
  name: Generate Plugin
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/plugingen/generate"
  body:
    type: json
    data: |-
      {
        "description": "Uppercase post titles on save",
        "language": "go",
        "hooks": ["before_save"],
        "capabilities": ["log_info"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
