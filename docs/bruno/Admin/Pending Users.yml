info:
  name: Pending Users
  type: http
  seq: 1
  docs: >-
    Returns the registration queue. Each user includes `emailVerified`
    (bool). With `[registration] admin_approval = true`, only registrants
    with `emailVerified: true` can be approved — see "Approve User"
    (409 EMAIL_NOT_VERIFIED otherwise).

http:
  method: GET
  url: "{{BASE_URL}}/api/admin/pending-users"
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
