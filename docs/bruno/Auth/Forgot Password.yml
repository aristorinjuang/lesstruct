info:
  name: Forgot Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{BASE_URL}}/api/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{EMAIL}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
