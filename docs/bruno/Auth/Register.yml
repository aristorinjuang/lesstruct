info:
  name: Register
  type: http
  seq: 5

# Always answers 200 with {"data":{"message":"..."}} — a duplicate username or
# email is indistinguishable from success (anti-enumeration); the existing
# account's holder gets a notice email instead. Other outcomes: 403
# REGISTRATION_DISABLED when self-registration is disabled. When the store
# resolves both terms of service and privacy policy (or
# [legal] registration_consent = true), omitting consentAccepted returns
# 400 CONSENT_REQUIRED.

http:
  method: POST
  url: "{{BASE_URL}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "{{USERNAME}}",
        "email": "{{USER_EMAIL}}",
        "password": "{{USER_PASSWORD}}",
        "consentAccepted": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
