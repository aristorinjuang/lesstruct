info:
  name: Set System Fields
  type: http
  seq: 5

http:
  method: PUT
  url: "{{BASE_URL}}/api/v1/content/{{CONTENT_ID}}/system-fields"
  body:
    type: json
    data: |-
      {
        "systemFields": {
          "editorial_status": "approved",
          "internal_notes": "Reviewed by agent"
        }
      }
  auth:
    type: bearer
    token: "{{API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
