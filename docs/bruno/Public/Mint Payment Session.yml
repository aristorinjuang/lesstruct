info:
  name: Mint Payment Session
  type: http
  seq: 22

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/public/orders/{{ORDER_NUMBER}}/payments/session"
  body:
    type: json
    data: |-
      {
        "email": "{{TRACK_EMAIL}}",
        "token": "{{TRACK_TOKEN}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
