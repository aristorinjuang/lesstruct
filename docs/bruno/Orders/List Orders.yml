info:
  name: List Orders
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/orders?status={{ORDER_STATUS}}&cursor={{ORDER_CURSOR}}"
  params:
    - name: status
      value: "{{ORDER_STATUS}}"
      type: query
      disabled: true
    - name: cursor
      value: "{{ORDER_CURSOR}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
