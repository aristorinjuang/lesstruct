info:
  name: Update Order Status (Agent)
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/orders/{{ORDER_ID}}/status"
  body:
    type: json
    data: |-
      {
        "status": "{{ORDER_STATUS}}"
      }
  auth:
    type: bearer
    token: "{{API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
