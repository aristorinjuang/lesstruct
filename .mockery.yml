all: false
dir: '{{.InterfaceDir}}/mocks'
filename: '{{.InterfaceName | snakecase}}_mock.go'
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: 'mocks'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/aristorinjuang/lesstruct:
    config:
      recursive: true
      all: true
      # The nested Go modules keep their own dependency sets: the kernel is
      # the frozen contract module and posttypes-basic ships no mocks, so
      # mock generation stays inside the root module's packages.
      exclude-subpkg-regex:
        - '^github\.com/aristorinjuang/lesstruct/kernel(/|$)'
        - '^github\.com/aristorinjuang/lesstruct/modules/posttypes-basic(/|$)'
