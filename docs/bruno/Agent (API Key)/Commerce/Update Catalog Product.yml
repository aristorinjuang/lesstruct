info:
  name: Update Catalog Product (Agent)
  type: http
  seq: 9

http:
  method: PUT
  url: "{{BASE_URL}}/api/v1/catalog/products/{{CONTENT_ID}}"
  body:
    type: json
    data: |-
      {
        "price": 299000,
        "salePrice": 249000,
        "sku": "TSHIRT",
        "trackInventory": true,
        "stock": 7,
        "lowStockThreshold": 3,
        "options": {
          "size": ["S", "M", "L"]
        },
        "variants": [
          { "options": { "size": "S" }, "sku": "TSHIRT-S", "stock": 2 },
          { "options": { "size": "M" }, "sku": "TSHIRT-M", "stock": 4, "price": 279000 }
        ]
      }
  auth:
    type: bearer
    token: "{{API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
