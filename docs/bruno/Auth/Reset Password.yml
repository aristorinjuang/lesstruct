info:
  name: Reset Password
  type: http
  seq: 9

http:
  method: POST
  url: "{{BASE_URL}}/api/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "token": "{{RESET_TOKEN}}",
        "newPassword": "{{USER_PASSWORD_NEW}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
