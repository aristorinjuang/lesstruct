info:
  name: Login
  type: http
  seq: 3
  docs: >-
    Step 1 of login: verifies the password and returns an MFA challenge
    (`challengeToken`, `emailHint`, `expiresIn` in seconds). The `username`
    field accepts either the account's username or its email address. No
    session is issued here — run "Verify MFA" with the emailed 6-digit code
    to receive the session cookie. In development (`DEV_MODE=true` with SMTP
    unconfigured) the code is printed to the server log. The seeded admin
    before first-login setup returns `{firstLoginRequired: true}` with no
    session instead; complete setup, then log in again.

http:
  method: POST
  url: "{{BASE_URL}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{USERNAME}}",
        "password": "{{USER_PASSWORD}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.data?.challengeToken) {
          // Save the MFA challenge for Verify MFA / Resend MFA
          bru.setEnvVar("MFA_CHALLENGE_TOKEN", res.body.data.challengeToken)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
