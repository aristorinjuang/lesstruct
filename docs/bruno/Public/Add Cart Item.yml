info:
  name: Add Cart Item
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/public/cart/items"
  headers:
    - name: X-Cart-Token
      value: "{{CART_TOKEN}}"
      disabled: false
  body:
    type: json
    data: |-
      {
        "productContentId": 1,
        "quantity": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
