info:
  name: Mark User as Spam
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/users/{{USER_ID}}/mark-spam"
  body:
    type: json
    data: |-
      {"confirmed": true}
  auth:
    type: bearer
    token: "{{API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
