info:
  name: Set Order Shipping
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/orders/{{ORDER_ID}}/shipping"
  body:
    type: json
    data: |-
      {
        "amount": 15000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
