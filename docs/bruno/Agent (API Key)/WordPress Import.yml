info:
  name: WordPress Import
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/wordpress/import"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - ./export.xml
      - name: skipMedia
        type: text
        value: "true"
  auth:
    type: bearer
    token: "{{API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
