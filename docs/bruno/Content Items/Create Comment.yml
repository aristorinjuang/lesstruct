info:
  name: Create Comment
  type: http
  seq: 8

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/content_items/{{SLUG}}/comments"
  body:
    type: json
    data: |-
      {
        "comment": "Great article!"
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
