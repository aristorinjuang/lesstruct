info:
  name: List Media
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/media?limit=10"
  params:
    - name: limit
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
