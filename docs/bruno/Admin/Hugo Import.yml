info:
  name: Hugo Import
  type: http
  seq: 20

http:
  method: POST
  url: "{{BASE_URL}}/api/admin/hugo/import"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - ./hugo-site.tar.gz
      - name: skipMedia
        type: text
        value: "true"
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
